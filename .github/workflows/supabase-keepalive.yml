# Supabase 무료 플랜은 7일 동안 사용이 적으면 프로젝트를 일시 정지한다.
# 하루 두 번 공개 키로 짧은 조회를 보내 심사 기간에도 서버가 깨어 있게 한다.
# 서버가 정지됐거나 응답이 이상하면 이 작업이 실패하고 GitHub가 메일로 알린다.
# 저장소 Secrets: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (공개 키. secret/service_role 키는 넣지 않는다)
# 예약 실행은 기본 브랜치(main)에 있는 파일만 동작한다.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3,15 * * *'  # 매일 12:17, 00:17 (한국 시간)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 서버에 조회 한 번 보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/organizations?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"
          test "$status" = 200
